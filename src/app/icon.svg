<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Favicon KossKoss Select.

    Repris du monogramme de l'en-tête (composant Monogram, src/components/kk/motifs.tsx) :
    le double K de la marque, en Beige Sable sur le Bleu Profond de la charte.

    Les traits sont volontairement plus épais que dans le monogramme d'origine
    et le double filet du cadre a été retiré : à 16 px dans un onglet, des
    traits de 3 unités et deux liserés imbriqués se referment en une tache.
  -->
  <rect width="100" height="100" rx="18" fill="#0F3B46"/>
  <rect x="12" y="12" width="76" height="76" rx="10" fill="none" stroke="#F3E8DD" stroke-opacity="0.35" stroke-width="2.5"/>
  <g fill="none" stroke="#F3E8DD" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- K de gauche : hampe et deux obliques -->
    <path d="M31 30 V70"/>
    <path d="M31 50 L48 30"/>
    <path d="M31 50 L48 70"/>
    <!-- K de droite, réduit à son chevron : le miroir du premier -->
    <path d="M55 30 L70 50 L55 70"/>
  </g>
</svg>
